// georu 매핑 상태 집계: 생성 코드의 미완 표시(TODO, WHERE 1 = 0, TODO PK, @mig-ok)를 모아 mapping-status.json 을 만든다.
// 운영 UI(매핑 현황)와 실행 전 확인(원천 미지정 차단)이 이 파일을 읽는다.
// build.gradle 에 한 줄: apply from: 'gradle/georu-mapping-status.gradle'
// 자동 생성: georu 코드 생성기

def mappingScanDirs = ['src/main/java', 'src/main/resources']
def mappingStatusOutDir = layout.buildDirectory.dir('generated/mapping-status')

tasks.register('scanMappingStatus') {
    group = 'verification'
    description = '생성 코드의 미완 표시(TODO, WHERE 1 = 0, PK TODO, @mig-ok)를 모아 mapping-status.json 을 만듭니다'
    mappingScanDirs.each { inputs.dir(it).withPropertyName("scan_${it.replace('/', '_')}").optional() }
    outputs.dir(mappingStatusOutDir)
    doLast {
        def suffixes = ['SourceMapper', 'TargetMapper', 'Mapper', 'Reader', 'Writer', 'Processor', 'SourceDto', 'TargetDto']
        def toTable = { String fileName ->
            String base = fileName.replaceFirst(/\.(java|xml)$/, '')
            String hit = suffixes.find { base.endsWith(it) && base.length() > it.length() }
            if (hit == null) return null
            base = base.substring(0, base.length() - hit.length())
            return base.replaceAll(/([a-z0-9])([A-Z])/, '$1_$2').replaceAll(/([A-Z]+)([A-Z][a-z])/, '$1_$2').toLowerCase()
        }
        def root = project.projectDir.toPath()
        def tables = new TreeMap<String, Map>()
        int fileCount = 0
        mappingScanDirs.each { dirName ->
            def dir = file(dirName)
            if (!dir.exists()) return
            dir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                String name = f.name
                boolean isJava = name.endsWith('.java')   // 테이블 접미어(Processor·SourceDto 등)로 거른다
                boolean isMapperXml = name.endsWith('Mapper.xml')
                if (!isJava && !isMapperXml) return
                String table = toTable(name)
                if (table == null) return
                fileCount++
                String rel = root.relativize(f.toPath()).toString().replace('\\', '/')
                int lineNo = 0
                f.eachLine('UTF-8') { String line ->
                    lineNo++
                    String type = null
                    String reviewed = null
                    int ok = line.indexOf('@mig-ok')
                    if (ok >= 0) {
                        reviewed = line.substring(ok + 7).replaceFirst(/^\s*:?\s*/, '').replaceFirst(/\s*(-->|\*\/)\s*$/, '').trim()
                    } else if (isMapperXml && line ==~ /^\s*WHERE\s+1\s*=\s*0\b.*/) {
                        type = 'SOURCE_UNDEFINED'
                    } else if (line.contains('TODO')) {
                        // 생성기 요약 주석("자동 매핑 0 / TODO 8", "(TODO)")은 실제 작업 위치가 아니라 제외
                        if (line ==~ /.*TODO\s+\d+\b.*/ || line.contains('(TODO)')) return
                        if (line.contains('TODO PK')) type = 'PK_TODO'
                        else if (line.contains('TODO 정렬키')) type = 'SORT_KEY_TODO'
                        else if (line.contains('TODO ←') || line.contains('TODO <-')) type = 'COLUMN_TODO'
                        else type = 'TODO'
                    }
                    if (type == null && reviewed == null) return
                    def t = tables.computeIfAbsent(table) { [counts: new TreeMap(), reviewedCount: 0, issues: [], reviewed: []] }
                    if (reviewed != null) {
                        t.reviewedCount++
                        if (t.reviewed.size() < 50) t.reviewed << [file: rel, line: lineNo, reason: reviewed]
                    } else {
                        t.counts[type] = (t.counts[type] ?: 0) + 1
                        // 위치는 유형별로 최대 20개까지만 담는다 (파일 크기 제한). 원천 미지정은 모두 담는다
                        int sameType = t.issues.count { it.type == type }
                        if (type == 'SOURCE_UNDEFINED' || sameType < 20) {
                            t.issues << [type: type, file: rel, line: lineNo, text: line.trim().take(160)]
                        }
                    }
                }
            }
        }
        def out = mappingStatusOutDir.get().asFile
        out.mkdirs()
        def json = groovy.json.JsonOutput.toJson([generatedAt: new Date().format("yyyy-MM-dd'T'HH:mm:ss"), scannedFiles: fileCount, tables: tables])
        new File(out, 'mapping-status.json').setText(json, 'UTF-8')
        logger.lifecycle("mapping-status.json: 파일 ${fileCount}개, 표시가 있는 테이블 ${tables.size()}개")
    }
}

tasks.named('processResources') {
    dependsOn 'scanMappingStatus'
    from(mappingStatusOutDir)
}
