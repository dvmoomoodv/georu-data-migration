// 실행 앱 모듈 규칙 (examples/*): Spring Boot bootJar, build-info. 배포하지 않는다
plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

def libs = extensions.getByType(VersionCatalogsExtension).named('libs')

dependencies {
    compileOnly libs.findLibrary('lombok').get()
    annotationProcessor libs.findLibrary('lombok').get()
    testCompileOnly libs.findLibrary('lombok').get()
    testAnnotationProcessor libs.findLibrary('lombok').get()

    testImplementation libs.findLibrary('spring-boot-starter-test').get()
    testRuntimeOnly libs.findLibrary('junit-platform-launcher').get()
}

springBoot {
    buildInfo()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked', '-Xlint:-options', '-parameters']
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
}
