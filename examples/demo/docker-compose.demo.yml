# =============================================================================
# 데모 실행용 compose 덮어쓰기 파일 (docker-compose.yml 위에 겹쳐 쓴다)
#
#   ./run-scripts/run-docker.sh demo          # 권장: 아래 명령을 감싸고, 앱이 떠 있으면 확인을 받는다
#   docker compose --env-file docker/.env -f docker-compose.yml -f docker-compose.demo.yml up -d --force-recreate demo-reset app
#
# 1) demo-reset: MySQL healthy 뒤 docker/mysql/tools/21_demo_tobe_reset.sql 로 demo_tobe 를 비우고 끝나는 1회성 서비스.
#    리셋은 앱(Java)이 아니라 이 컨테이너가 한다 (제품은 타겟 데이터를 지우지 않는다).
# 2) app: 리셋이 성공한 뒤에만 기동한다.
#    채번 모듈이 키별 선점 상태를 메모리에 들고 있으므로 리셋할 때는 앱도 다시 만들어야 한다 (--force-recreate).
# 이 파일 없이 docker compose up 하면 리셋 없이 기존 demo_tobe 데이터 위에서 기동한다.
# =============================================================================
services:
  demo-reset:
    image: mysql:8.0
    container_name: georu-demo-reset
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:-password}
      MARIADB_PWD: ${MARIADB_ROOT_PASSWORD:-password}
    volumes:
      - ./docker/mysql/tools/21_demo_tobe_reset.sql:/demo/21_demo_tobe_reset.sql:ro
      - ./docker/mariadb/tools/31_demo_mart_reset.sql:/demo/31_demo_mart_reset.sql:ro
    entrypoint:
      - sh
      - -c
      - |
        mysql -h mysql -uroot < /demo/21_demo_tobe_reset.sql && echo '[DEMO-RESET] demo_tobe · demo_dw 비움 완료' || exit 1
        # 여러 DB 예제(demo.xdb)의 MariaDB 가 떠 있으면 demo_mart 도 비운다 (없으면 건너뜀)
        if MYSQL_PWD=$$MARIADB_PWD mysql -h mariadb -uroot -e 'SELECT 1' >/dev/null 2>&1; then
          MYSQL_PWD=$$MARIADB_PWD mysql -h mariadb -uroot < /demo/31_demo_mart_reset.sql && echo '[DEMO-RESET] demo_mart 비움 완료' || exit 1
        fi
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  app:
    depends_on:
      demo-reset:
        condition: service_completed_successfully
