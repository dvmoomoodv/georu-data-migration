<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{ui/layout :: head('DDL → 테이블')}"></head>
<body>
<header th:replace="~{ui/layout :: nav}"></header>
<main>
    <div class="page-head"><h1>DDL → 테이블</h1><p class="page-desc">CREATE TABLE 문을 붙여 넣으면 컬럼 정의 표로 바꿔 줍니다 · 브라우저에서만 처리하고 저장하지 않습니다</p></div>
    <div th:replace="~{ui/layout :: ddlTabs}"></div>
    <div class="split">
        <div class="card" data-collapse="input" data-collapse-sum="#dialect">
            <div class="card-head">
                <h2>DDL 입력</h2>
                <div class="inline">
                    <label class="small">DBMS
                        <select id="dialect"><option value="auto">자동 감지</option><option>Oracle</option><option>MySQL</option><option>MSSQL</option><option>PostgreSQL</option></select></label>
                    <button class="btn sm" id="clear" type="button">지우기</button>
                </div>
            </div>
            <div class="mt-8 inline small"><button class="btn sm" id="sample" type="button" title="예제 DDL 을 넣고 바로 변환">예제 ▾</button><span class="muted">읽는 구문 · 관련 규칙은 <a href="#" data-panel-open="help">? 도움말</a></span></div>
            <textarea id="ddl" class="mono" style="width:100%;height:58vh;margin-top:8px;font-size:12px" placeholder="CREATE TABLE ... ( ... );
COMMENT ON COLUMN ... IS '...';   -- Oracle/PostgreSQL
ALTER TABLE ... ADD CONSTRAINT ... PRIMARY KEY (...);
EXEC sp_addextendedproperty ...   -- MSSQL 설명
여러 테이블을 한 번에 붙여 넣어도 됩니다."></textarea>
            <div class="inline" style="margin-top:8px;justify-content:space-between">
                <button class="btn primary" id="run" type="button">변환</button>
                <span class="small muted">Ctrl+Enter 로 변환</span>
            </div>
        </div>
        <div class="card">
            <div class="card-head">
                <h2>컬럼 정의 <span class="small muted" id="meta"></span></h2>
                <div class="inline">
                    <select id="tableFilter" title="테이블 선택"><option value="">전체 테이블</option></select>
                    <button class="btn primary sm" id="copy" type="button" title="탭 구분 텍스트로 복사. 엑셀 셀에 바로 붙여 넣기">엑셀용 복사</button>
                    <button class="btn sm" id="copyMd" type="button" title="Markdown 표로 복사">Markdown 복사</button>
                </div>
            </div>
            <details class="mt-6"><summary class="small">표시 열 선택</summary><div class="mt-6 inline small" id="colPick"></div></details>
            <div id="warn"></div>
            <div id="out" style="margin-top:8px;overflow:auto;max-height:70vh"><div class="empty">왼쪽에 DDL 을 넣고 변환을 누르세요.</div></div>
        </div>
    </div>
</main>
<script th:src="@{/ui-assets/ddl-parser.js}"></script>
<script th:src="@{/ui-assets/ddl-samples.js}"></script>
<script>
(function () {
  const { esc, toast, $ } = UI;
  const P = window.DdlParser;
  // 입력 DDL 을 브라우저에 공유: 다른 DDL 도구로 가도 같은 입력이 남는다 (저장소 아님)
  const SHARE_KEY = 'ui.ddl.input';
  try { const sv = localStorage.getItem(SHARE_KEY); if (sv && !$('#ddl').value) $('#ddl').value = sv; } catch (e) { /* ignore */ }
  $('#ddl').addEventListener('change', () => { try { localStorage.setItem(SHARE_KEY, $('#ddl').value); } catch (e) { /* ignore */ } });
  const DEFAULT_KEYS = ['table', 'no', 'name', 'typeRaw', 'typeName', 'length', 'scale', 'unit', 'notNull', 'defaultValue', 'pk', 'unique', 'fk', 'auto', 'comment'];
  let keys = DEFAULT_KEYS.slice();
  try { const k = JSON.parse(localStorage.getItem('ui.ddl.keys') || 'null'); if (Array.isArray(k) && k.length) keys = k; } catch (e) { /* ignore */ }
  let result = null;

  // 표시 열 체크박스
  $('#colPick').innerHTML = P.COLUMNS.map(c => `<label class="check"><input type="checkbox" data-key="${c.key}" ${keys.includes(c.key) ? 'checked' : ''}> ${esc(c.label)}</label>`).join('');
  $('#colPick').addEventListener('change', () => {
    keys = P.COLUMNS.map(c => c.key).filter(k => $('#colPick').querySelector(`[data-key="${k}"]`).checked);
    try { localStorage.setItem('ui.ddl.keys', JSON.stringify(keys)); } catch (e) { /* ignore */ }
    render();
  });

  function currentRows() { return result ? P.rows(result, { table: $('#tableFilter').value || null }) : []; }
  function render() {
    if (!result) return;
    const rows = currentRows();
    const cols = P.COLUMNS.filter(c => keys.includes(c.key));
    $('#meta').textContent = `${result.dialect} · 테이블 ${result.tables.length}개 · 컬럼 ${rows.length}개`;
    if (!rows.length) { $('#out').innerHTML = '<div class="empty">읽은 테이블이 없습니다. DDL 형식을 확인하세요.</div>'; return; }
    let html = '<table><tr>' + cols.map(c => `<th>${esc(c.label)}</th>`).join('') + '</tr>';
    let last = null;
    for (const r of rows) {
      const sep = last !== null && last !== r.table ? ' style="border-top:2px solid var(--line-strong)"' : ''; last = r.table;
      html += `<tr${sep}>` + cols.map(c => { const v = r[c.key]; const cls = ['no', 'length', 'scale', 'pk'].includes(c.key) ? ' class="mono"' : (['typeRaw', 'typeName', 'defaultValue', 'name'].includes(c.key) ? ' class="mono"' : '');
        const txt = c.key === 'pk' && v ? `<span class="badge COMPLETED">PK${v !== '1' || rows.some(x => x.table === r.table && x.pk === '2') ? ' ' + v : ''}</span>` : (c.key === 'notNull' && v === 'Y' ? '<b>Y</b>' : esc(v));
        return `<td${cls}>${txt}</td>`; }).join('') + '</tr>';
    }
    $('#out').innerHTML = html + '</table>';
  }
  function run() {
    const sql = $('#ddl').value; try { localStorage.setItem(SHARE_KEY, sql); } catch (e) { /* ignore */ }
    if (!sql.trim()) { toast('DDL 을 넣어 주세요', 'err'); return; }
    try { result = P.parse(sql, { dialect: $('#dialect').value }); }
    catch (e) { $('#warn').innerHTML = `<div class="alert err">읽는 중 오류: ${esc(e.message)}</div>`; return; }
    const tf = $('#tableFilter'); tf.innerHTML = '<option value="">전체 테이블 (' + result.tables.length + ')</option>' + result.tables.map(t => `<option value="${esc(t.name)}">${esc(t.name)}${t.comment ? ' · ' + esc(t.comment) : ''} (${t.columns.length})</option>`).join('');
    $('#warn').innerHTML = result.warnings.length ? `<details class="mt-6 alert warn"><summary>읽지 못한 부분 ${result.warnings.length}건</summary><ul class="small">${result.warnings.slice(0, 50).map(w => `<li>${esc(w)}</li>`).join('')}</ul></details>` : '';
    render();
    if (result.tables.length) toast(`테이블 ${result.tables.length}개, 컬럼 ${P.rows(result).length}개`, 'ok');
  }
  async function copyText(text, label) {
    try { await navigator.clipboard.writeText(text); toast(label + ' 복사됨 (' + currentRows().length + '행)', 'ok'); }
    catch (e) { // 클립보드 권한이 없으면 선택 가능한 창을 띄운다
      const bg = document.createElement('div'); bg.className = 'modal-bg open';
      bg.innerHTML = `<div class="modal"><h2>${esc(label)}</h2><div class="small muted">클립보드 권한이 없어 직접 복사하세요 (Ctrl+A, Ctrl+C)</div><textarea class="mono" style="width:100%;height:320px;margin-top:8px"></textarea><div class="inline" style="justify-content:flex-end;margin-top:8px"><button class="btn" id="mc">닫기</button></div></div>`;
      document.body.appendChild(bg); const ta = bg.querySelector('textarea'); ta.value = text; ta.focus(); ta.select(); bg.querySelector('#mc').onclick = () => bg.remove();
    }
  }
  $('#copy').onclick = () => { if (!result) return toast('먼저 변환하세요', 'err'); copyText(P.toTsv(currentRows(), keys), '엑셀용(탭 구분)'); };
  $('#copyMd').onclick = () => {
    if (!result) return toast('먼저 변환하세요', 'err');
    const cols = P.COLUMNS.filter(c => keys.includes(c.key)); const rows = currentRows();
    const md = ['| ' + cols.map(c => c.label).join(' | ') + ' |', '|' + cols.map(() => '---').join('|') + '|'].concat(rows.map(r => '| ' + cols.map(c => String(r[c.key] == null ? '' : r[c.key]).replace(/\|/g, '\\|')).join(' | ') + ' |')).join('\n');
    copyText(md, 'Markdown');
  };
  $('#run').onclick = run;
  $('#clear').onclick = () => { $('#ddl').value = ''; result = null; $('#out').innerHTML = '<div class="empty">왼쪽에 DDL 을 넣고 변환을 누르세요.</div>'; $('#warn').innerHTML = ''; $('#meta').textContent = ''; $('#tableFilter').innerHTML = '<option value="">전체 테이블</option>'; };
  $('#tableFilter').onchange = render;
  $('#ddl').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); } });
  window.DdlSamples.pop($('#sample'), window.DdlSamples.samples.ddl, (smp) => { $('#ddl').value = smp.sql; $('#dialect').value = smp.dialect || 'auto'; run(); });
})();
</script>
</body>
</html>
