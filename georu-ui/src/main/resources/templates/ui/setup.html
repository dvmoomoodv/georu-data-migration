<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'초기 설정 - ' + ${brand ?: 'Georu'}">초기 설정 - Georu</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/ui-assets/georu-mark.svg}">
    <link rel="stylesheet" th:href="@{/ui-assets/ui.css}">
    <link rel="stylesheet" th:href="@{/ui-assets/theme-georu.css}">
    <link rel="stylesheet" th:href="@{/ui-assets/components.css}">
</head>
<body class="login">
<main class="login-card wide" role="main">
    <h1><img th:src="@{/ui-assets/georu-mark.svg}" alt="" width="40" height="40"><span class="brand-name" th:text="${brand ?: 'Georu'}">Georu</span></h1>
    <p class="sub">초기 설정 · 관리자 비밀번호 정하기</p>
    <div class="alert warn small">운영 UI 에 관리자 계정이 아직 없습니다. 여기서 정한 비밀번호로 로그인합니다. 비밀번호는 서버가 만들지도, 로그에 남기지도 않습니다.</div>
    <div class="alert err small" th:if="${param.error != null and param.error[0] == 'short'}">비밀번호는 8자 이상이어야 합니다.</div>
    <div class="alert err small" th:if="${param.error != null and param.error[0] == 'mismatch'}">두 비밀번호가 다릅니다.</div>
    <form method="post" th:action="@{/setup}" autocomplete="off">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="field"><label for="username">아이디</label><input id="username" name="username" th:value="${username}" value="admin" readonly></div>
        <div class="field"><label for="password">비밀번호 <span class="muted">(8자 이상)</span></label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required autofocus></div>
        <div class="field"><label for="password2">비밀번호 확인</label><input id="password2" name="password2" type="password" autocomplete="new-password" minlength="8" required></div>
        <button class="btn primary" type="submit">정하고 로그인 화면으로</button>
    </form>
    <div class="note">
        처음 띄운 직후와 비밀번호 리셋(<code>GEORU_ADMIN_RESET_PASSWORD=true</code>) 직후에는 <b>먼저 접속하는 사람</b>이 이 화면을 봅니다.
        기동하자마자 운영자가 정하고, 앱은 신뢰할 수 있는 내부망에만 두세요. 자세한 절차: <a th:href="@{/api/ui/guides/login}" target="_blank">안내서 "로그인 · 접근 통제"</a>
    </div>
    <div class="ver" th:if="${georuVersion}" th:text="'Georu ' + ${georuVersion}">Georu</div>
</main>
</body>
</html>
